bcr_test_module:
  module_path: test_module
  matrix:
    platform: [ubuntu2204, ubuntu2404]
    bazel: [9.x]
  tasks:
    native_and_cross:
      name: Native filesystem test and cross builds with hermetic LLVM
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //:linux_amd64
        - //:linux_arm64
      test_targets:
        - //:filesystem_test
